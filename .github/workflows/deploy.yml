name: Deploy Rudrakrit Backend

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
deploy:
runs-on: self-hosted

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "22"

  - name: Install dependencies
    run: npm ci

  - name: Deploy backend with PM2
    run: |
      mkdir -p "$HOME/apps/Rudrakrit"
      rsync -a --delete \
        --exclude='.git/' \
        --exclude='node_modules/' \
        --exclude='.env' \
        ./ "$HOME/apps/Rudrakrit/"

      cd "$HOME/apps/Rudrakrit"
      npm ci --omit=dev
      pm2 startOrReload ecosystem.config.js --update-env || pm2 start server.js --name rudrakrit-backend
      pm2 save
```
