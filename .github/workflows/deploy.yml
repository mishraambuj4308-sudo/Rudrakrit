name: Deploy Rudrakrit Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Deploy backend
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/apps/Rudrakrit"
          rsync -a --delete --exclude='.git/' --exclude='node_modules/' --exclude='.env' ./ "$HOME/apps/Rudrakrit/"
          cd "$HOME/apps/Rudrakrit"
          npm ci --omit=dev
          if pm2 describe rudrakrit-backend >/dev/null 2>&1; then
            pm2 restart rudrakrit-backend
          else
            pm2 start server.js --name rudrakrit-backend
          fi
          pm2 save
